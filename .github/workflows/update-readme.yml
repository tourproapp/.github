name: Update org profile README

on:
  # Weekly refresh picks up new public repos and description changes.
  schedule:
    - cron: "0 9 * * 1"
  # Manual trigger after adding a repo or editing an override.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "profile/projects.json"
      - "scripts/generate-profile.mjs"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate projects table
        run: node scripts/generate-profile.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "README already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/README.md
          git commit -m "Update projects table in org profile README"
          git push
